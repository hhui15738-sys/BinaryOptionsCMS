name: Build Demo

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/laravel-12

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Configure isolated demo
        run: |
          cp .env.docker.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=true|" .env
          sed -i "s|^PG_DB_PASSWORD=.*|PG_DB_PASSWORD=demo-postgres-password|" .env
          sed -i "s|^MYSQL_DB_PASSWORD=.*|MYSQL_DB_PASSWORD=demo-mysql-password|" .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=demo-mysql-root-password|" .env
          sed -i "s|^CLICKHOUSE_ADMIN_PASSWORD=.*|CLICKHOUSE_ADMIN_PASSWORD=demo-clickhouse-password|" .env
          sed -i "s|^ADMIN_EMAIL=.*|ADMIN_EMAIL=admin@example.test|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=DemoPassword123!|" .env

      - name: Start demo stack
        run: |
          docker compose up -d --build nginx echo
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs app
          exit 1

      - name: Capture running application
        run: |
          npm install --no-save --package-lock=false playwright-core@latest
          node scripts/capture-demo.mjs

      - name: Upload demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: laravel-12-demo
          path: demo-screenshots
          if-no-files-found: error

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop demo stack
        if: always()
        run: docker compose down -v
