services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      RUN_BOOTSTRAP: "true"
    volumes:
      - app-storage:/var/www/storage
      - app-public:/var/www/public
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/app-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - app-public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB_DATABASE:?Set PG_DB_DATABASE}
      POSTGRES_USER: ${PG_DB_USERNAME:?Set PG_DB_USERNAME}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD:?Set PG_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DB_DATABASE:?Set MYSQL_DB_DATABASE}
      MYSQL_USER: ${MYSQL_DB_USERNAME:?Set MYSQL_DB_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:?Set MYSQL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_DB_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  echo:
    build:
      context: .
      dockerfile: docker/echo/Dockerfile
    restart: unless-stopped
    ports:
      - 127.0.0.1:6001:6001
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  order-checks:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "check:orders"]
    depends_on:
      app:
        condition: service_healthy

  quotes-parser:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    profiles: ["market-data"]
    env_file: .env
    command: ["php", "artisan", "tradingview:start"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-storage:
  app-public:
  postgres-data:
  mysql-data:
  clickhouse-data:
